name: Sibawayh Flutter and Firebase
on:
  push:
    branches: [main]
    paths: ['student_mobile_app/**','firebase/**','firebase.json','tests/firebase/**','.github/workflows/sibawayh.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sibawayh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: student_mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cp .env.example .env
      - run: flutter pub get
      - name: Patch legacy WebView Gradle compatibility
        run: |
          plugin="$PUB_CACHE/hosted/pub.dev/flutter_inappwebview_android-1.1.3/android/build.gradle"
          if [ -f "$plugin" ]; then
            sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$plugin"
          fi
      - name: Fix YouTube embed client identity and initialization
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['PUB_CACHE']) / 'hosted/pub.dev/youtube_player_embed-1.6.4/lib/youtube_player_embed.dart'
          s = p.read_text()
          old = 'url: WebUri(url.replaceAll(" ", "")),'
          assert old in s, 'Unexpected embed source'
          s = s.replace(old, old + "\n            headers: {'Referer': 'https://com.sibawayh.academy/'},")
          s = s.replace('&rel=0', '&rel=0\n    &widget_referrer=https%3A%2F%2Fcom.sibawayh.academy%2F')
          s = s.replace('await embedController?.changeVideoTitle(\n              customVideoTitle: widget.customVideoTitle!,\n            );', 'if (widget.customVideoTitle != null) {\n              await embedController?.changeVideoTitle(customVideoTitle: widget.customVideoTitle!);\n            }')
          p.write_text(s)
          PY
      - run: dart format lib/sibawayh lib/main.dart test/sibawayh_test.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: dart run flutter_launcher_icons
      - name: Build trial APK
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
        run: >-
          flutter build apk --debug
          --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
          --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
          --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: Sibawayh-Flutter-Trial
          path: student_mobile_app/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Formatted-source-and-lock
          path: |
            student_mobile_app/lib/sibawayh/
            student_mobile_app/pubspec.lock
  firebase-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix tests/firebase
      - run: tests/firebase/node_modules/.bin/firebase emulators:exec --only firestore --project demo-sibawayh 'npm test --prefix tests/firebase'
